# main 에 푸시하면 사이트 코드를 검사(lint · 빌드)한 뒤 Cloudflare Workers(wuwa-portfolio)에 배포
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# DB(Neon)는 배포 환경에서 Hyperdrive 로 연결되므로 DATABASE_URL 은 넣지 않음.
# DB 내용(db/seed.sql)은 자동으로 반영하지 않음: npm run db:setup 은 테이블을 지우고 다시 만들기 때문
name: Deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 푸시는 배포하지 않음
    paths-ignore:
      - '**.md'
  workflow_dispatch: # Actions 탭에서 직접 다시 배포할 때

# 연달아 푸시하면 앞의 배포가 끝난 뒤 다음 배포 (중간에 끊지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # 시크릿이 없으면 GitHub 는 빈 값을 넘기므로, 배포까지 가기 전에 어느 것이 비었는지 알려 주고 멈춤 (값은 출력 안 함)
      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 비어 있음 (Settings > Secrets and variables > Actions > Repository secrets)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID 시크릿이 비어 있음"; exit 1; }
          echo "secrets ok"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
      - run: npm run lint
      # deploy 가 빌드까지 하므로 따로 build 하지 않음
      # CI 에선 커밋 메시지 전체가 Worker 버전 메모로 붙는데 Cloudflare 길이 제한(100자)을 넘으므로 빼고,
      # 커밋 SHA 태그만 남김
      - run: npm run deploy -- --message "" --verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
