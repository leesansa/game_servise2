# main 에 푸시하면 react/basic/ppo 를 검사(lint · 빌드)한 뒤 Cloudflare Workers(wuwa-portfolio)에 배포
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# DB(Neon)는 배포 환경에서 Hyperdrive 로 연결되므로 DATABASE_URL 은 넣지 않음.
# DB 내용(db/seed.sql)은 자동으로 반영하지 않음: npm run db:setup 은 테이블을 지우고 다시 만들기 때문
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'react/basic/ppo/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Actions 탭에서 직접 다시 배포할 때

# 연달아 푸시하면 앞의 배포가 끝난 뒤 다음 배포 (중간에 끊지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: react/basic/ppo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/basic/ppo/package-lock.json
      - run: npm ci
      - run: npm run lint
      # deploy 가 빌드까지 하므로 따로 build 하지 않음
      # CI 에선 커밋 메시지 전체가 Worker 버전 메모로 붙는데 Cloudflare 길이 제한(100자)을 넘으므로 빼고,
      # 커밋 SHA 태그만 남김
      - run: npm run deploy -- --message "" --verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
